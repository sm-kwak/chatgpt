[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doctor-agent-lab"
version = "0.1.0"
description = "Simulation-only sequential diagnostic agent research scaffold"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
doctor-agent = "doctor_agent.cli:main"

[tool.setuptools.packages.find]
include = ["doctor_agent*"]
